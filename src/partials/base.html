<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://kiberatunghessen.com{{url}}">

<meta property="og:type" content="website">
<meta property="og:locale" content="de_DE">
<meta property="og:site_name" content="KI Beratung Hessen">

<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://kiberatunghessen.com{{url}}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

</head>
<body class="{{bodyClass}}">
<!-- Arms the scroll-in animations before first paint, so the page never
     flashes its content and then hides it. No JS, no hiding. -->
<script>document.documentElement.className += " js-anim";</script>
<a class="skip-link" href="#content">Zum Inhalt springen</a>
{{header}}
<main id="content">
{{content}}
</main>
{{footer}}
<script src="{{jsSrc}}" defer></script>
</body>
</html>
